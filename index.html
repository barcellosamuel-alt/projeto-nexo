<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Nexo — Sanctuary Master (Medicina UEL)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Chart.js para o Gráfico Longitudinal -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --border-color: #cbd5e1;
            --border-hover: #38bdf8;
            --accent-primary: #0284c7;
            --accent-amber: #d97706;
            --accent-emerald: #059669;
            --text-main: #0f172a;
            --text-muted: #475569;
            --danger: #dc2626;
            --shadow-soft: 0 15px 35px -5px rgba(15, 23, 42, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(2, 132, 199, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(5, 150, 105, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .top-utility-bar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        /* ABA DE ENTRADA: Glassmorphism Holográfico com Borda Animada (Neon Glow & Caleidoscópio) */
        header.hero {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
            color: white;
            padding: 35px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            background-clip: padding-box;
            animation: holographicShift 12s ease infinite;
        }

        header.hero::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            background: linear-gradient(45deg, #38bdf8, #34d399, #f59e0b, #38bdf8);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderKaleidoscope 6s linear infinite;
        }

        @keyframes holographicShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes borderKaleidoscope {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header.hero h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header.hero p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        .hero-badge-tech {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .tech-pulse {
            width: 8px; height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulseLive 2s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 15px #34d399; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Relógio e Calendário Estabilizado com Glassmorphism Avançado */
        .clock-widget {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 18px 28px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            box-shadow: var(--shadow-soft);
            min-width: 220px;
            transition: all 0.3s ease;
        }
        .clock-widget:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.15);
        }

        .clock-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .clock-date {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 2px;
        }

        .calendar-sync-btn {
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-sync-btn:hover { text-decoration: underline; }

        .tools-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-soft);
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: #e0f2fe;
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .aux-drawer {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: none;
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pet Digital Holográfico Avançado */
        .pet-companion {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 27, 75, 0.95));
            border: 2px solid #38bdf8;
            padding: 16px 22px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .pet-companion:hover { 
            transform: scale(1.08) rotate(1deg); 
            box-shadow: 0 20px 45px rgba(56, 189, 248, 0.5);
        }
        .pet-avatar { 
            font-size: 38px; 
            background: rgba(56, 189, 248, 0.15); 
            padding: 8px; 
            border-radius: 16px; 
            border: 1px solid rgba(56, 189, 248, 0.3);
            animation: bouncePet 2s infinite ease-in-out; 
        }
        @keyframes bouncePet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .pet-info { display: flex; flex-direction: column; }
        .pet-bubble { font-size: 13px; color: #f8fafc; font-weight: 700; max-width: 210px; }
        .pet-status { font-size: 11px; color: #34d399; font-weight: 700; margin-top: 3px; }

        /* MÓDULOS COM RECURSOS VARIADOS E IDENTIDADE PRÓPRIA */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-primary);
            transition: width 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.15);
        }
        .card:hover::before { width: 8px; }

        .card.card-emerald::before { background: var(--accent-emerald); }
        .card.card-amber::before { background: var(--accent-amber); }
        .card.card-purple::before { background: #8b5cf6; }
        .card.card-rose::before { background: #e11d48; }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-header svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-primary);
            margin-right: 14px;
            flex-shrink: 0;
        }

        .card h3 {
            margin: 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
        }

        .card p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-primary);
            margin-bottom: 8px;
            margin-top: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        button.action-btn {
            background-color: var(--accent-primary);
            border: none;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        button.action-btn:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .btn-success {
            background-color: var(--accent-emerald) !important;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25) !important;
        }
        .btn-success:hover {
            background-color: #047857 !important;
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35) !important;
        }

        .response-box {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: #0f172a;
            padding: 22px;
            border-radius: 14px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            border-left: 4px solid var(--accent-primary);
        }

        .content-display {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-primary);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .timer-badge {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 14px;
            margin-left: auto;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .metric-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 16px;
            position: relative;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-emerald));
            border-radius: 16px 16px 0 0;
        }

        .metric-card strong {
            color: var(--text-main);
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media(max-width: 850px) {
            .top-utility-bar { grid-template-columns: 1fr; }
            .clock-widget { align-items
