<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Nexo — Sanctuary Master (Medicina UEL)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-base: #04070d;
            --bg-card: rgba(13, 20, 35, 0.85);
            --border-glow: rgba(56, 189, 248, 0.35);
            --border-hover: rgba(56, 189, 248, 0.9);
            --accent-cyan: #38bdf8;
            --accent-emerald: #34d399;
            --accent-amber: #fbbf24;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-neon: 0 0 35px rgba(56, 189, 248, 0.18);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.75);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(2, 132, 199, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(5, 150, 105, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .top-utility-bar { display: grid; grid-template-columns: 1fr auto; gap: 24px; margin-bottom: 30px; align-items: center; }

        /* Hero com Efeito Cometa em Movimento e Brilho Dinâmico */
        header.hero {
            background: linear-gradient(135deg, rgba(9, 13, 22, 0.95) 0%, rgba(15, 23, 42, 0.92) 50%, rgba(30, 27, 75, 0.88) 100%);
            color: white; padding: 40px; border-radius: 28px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), var(--shadow-card);
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
            border: 2px solid rgba(56, 189, 248, 0.45);
            backdrop-filter: blur(20px);
        }
        
        /* Efeito de Cometa (Linha de luz cruzando a borda) */
        header.hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), #ffffff, transparent);
            animation: cometMove 4s linear infinite;
        }
        @keyframes cometMove {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        header.hero h1 {
            font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 800; margin: 0 0 8px 0;
            background: linear-gradient(90deg, #38bdf8, #34d399, #ffffff, #38bdf8);
            background-size: 300% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: neonGlowFlow 6s linear infinite;
        }
        @keyframes neonGlowFlow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 12px rgba(56,189,248,0.5)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 25px rgba(52,211,153,0.8)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 12px rgba(56,189,248,0.5)); }
        }
        header.hero p { font-size: 14px; color: var(--text-muted); margin: 0; font-weight: 500; }

        .hero-badge-tech {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 12px 20px; border-radius: 16px; font-weight: 700; font-size: 12px; color: var(--accent-cyan);
            display: flex; align-items: center; gap: 10px; backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .tech-pulse { width: 9px; height: 9px; background: var(--accent-emerald); border-radius: 50%; box-shadow: 0 0 15px var(--accent-emerald); animation: pulseLive 2s infinite; }
        @keyframes pulseLive { 
            0% { transform: scale(0.95); opacity: 0.8; } 
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 25px var(--accent-emerald); } 
            100% { transform: scale(0.95); opacity: 0.8; } 
        }

        .clock-widget {
            background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glow);
            padding: 22px 32px; border-radius: 24px; display: flex; flex-direction: column; align-items: flex-end;
            justify-content: center; box-shadow: var(--shadow-neon), var(--shadow-card); min-width: 240px;
        }
        .clock-widget:hover { border-color: var(--border-hover); box-shadow: 0 0 40px rgba(56, 189, 248, 0.4); }
        .clock-time { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: var(--accent-cyan); text-shadow: 0 0 12px rgba(56,189,248,0.5); }
        .clock-date { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-top: 4px; }
        .calendar-sync-btn { background: transparent; border: none; color: var(--accent-cyan); font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 8px; padding: 0; }
        .calendar-sync-btn:hover { text-decoration: underline; text-shadow: 0 0 8px rgba(56,189,248,0.7); }

        .tools-bar { display: flex; gap: 14px; margin-bottom: 30px; flex-wrap: wrap; }
        .tool-btn {
            background: var(--bg-card); border: 1px solid var(--border-glow); color: var(--text-main);
            padding: 14px 22px; border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 13px;
            display: inline-flex; align-items: center; gap: 10px; box-shadow: var(--shadow-neon);
            backdrop-filter: blur(15px); transition: all 0.25s ease;
        }
        .tool-btn:hover {
            background: rgba(56, 189, 248, 0.18); border-color: var(--border-hover); color: var(--accent-cyan);
            transform: translateY(-3px); box-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
        }

        .aux-drawer {
            background: var(--bg-card); border: 1px solid var(--border-glow); padding: 28px;
            border-radius: 24px; margin-bottom: 30px; display: none; box-shadow: 0 0 45px rgba(0,0,0,0.65);
            backdrop-filter: blur(25px); animation: fadeInDrawer 0.3s ease;
        }
        @keyframes fadeInDrawer { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-glow); padding: 40px;
            border-radius: 28px; margin-bottom: 30px; box-shadow: var(--shadow-card), var(--shadow-neon);
            position: relative; overflow: hidden; backdrop-filter: blur(20px);
        }
        .card:hover { border-color: var(--border-hover); box-shadow: 0 0 50px rgba(56, 189, 248, 0.3), var(--shadow-card); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); }
        .card-emerald::before { background: var(--accent-emerald); box-shadow: 0 0 15px var(--accent-emerald); }
        .card-amber::before { background: var(--accent-amber); box-shadow: 0 0 15px var(--accent-amber); }
        .card-purple::before { background: #8b5cf6; box-shadow: 0 0 15px #8b5cf6; }
        .card-rose::before { background: var(--accent-rose); box-shadow: 0 0 15px var(--accent-rose); }

        .card-header { display: flex; align-items: center; margin-bottom: 20px; }
        .card-header svg { width: 30px; height: 30px; fill: var(--accent-cyan); margin-right: 16px; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(56,189,248,0.6)); }
        .card h3 { margin: 0; color: var(--text-main); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .card p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }

        label { display: block; font-weight: 700; font-size: 12px; color: var(--accent-cyan); margin-bottom: 8px; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], textarea {
            width: 100%; padding: 16px 20px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px;
            border: 1px solid var(--border-glow); border-radius: 14px; background: rgba(15, 23, 42, 0.85); color: var(--text-main);
        }
        input[type="text"]:focus, textarea:focus { border-color: var(--accent-cyan); outline: none; box-shadow: 0 0 25px rgba(56,189,248,0.5); }

        button.action-btn {
            background-color: var(--accent-cyan); border: none; color: #04070d; padding: 16px 28px;
            border-radius: 14px; cursor: pointer; font-weight: 800; font-size: 14px;
            display: inline-flex; align-items: center; gap: 10px; margin-top: 16px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); transition: all 0.25s ease;
        }
        button.action-btn:hover { background-color: #7dd3fc; box-shadow: 0 0 35px rgba(56, 189, 248, 0.8); transform: translateY(-2px); }
        .btn-success { background-color: var(--accent-emerald) !important; color: #04070d !important; box-shadow: 0 0 20px rgba(5, 150, 105, 0.5) !important; }
        .btn-success:hover { background-color: #6ee7b7 !important; box-shadow: 0 0 35px rgba(5, 150, 105, 0.85) !important; }

        .response-box {
            background: rgba(9, 13, 22, 0.95); border: 1px solid var(--border-glow); color: var(--accent-cyan); padding: 24px;
            border-radius: 16px; margin-top: 24px; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace;
            font-size: 13px; border-left: 4px solid var(--accent-cyan); box-shadow: inset 0 0 20px rgba(56,189,248,0.12);
        }
        .content-display { background: rgba(15, 23, 42, 0.75); border: 1px solid var(--border-glow); border-left: 5px solid var(--accent-cyan); padding: 24px; border-radius: 16px; margin-bottom: 24px; }
        .timer-badge { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fb7185; padding: 10px 18px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 14px; margin-left: auto; box-shadow: 0 0 15px rgba(244,63,94,0.3); }

        /* Estilos da Calculadora Científica Real */
        .sci-calc-container { background: #111827; border: 2px solid var(--border-glow); padding: 20px; border-radius: 20px; max-width: 380px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .sci-display { width: 100%; background: #030712; color: #34d399; font-family: 'JetBrains Mono', monospace; font-size: 26px; padding: 14px; text-align: right; border: 1px solid var(--border-glow); border-radius: 12px; margin-bottom: 15px; }
        .sci-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .sci-btn { background: #1f2937; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); padding: 12px 0; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .sci-btn:hover { background: #374151; color: var(--accent-cyan); }
        .sci-btn.op { background: #0284c7; color: white; }
        .sci-btn.eq { background: #059669; color: white; grid-column: span 2; }

        /* Widget Arcade / Mini-Game UEL Flutuante */
        .arcade-widget {
            position: fixed; bottom: 25px; right: 25px; z-index: 1000;
            background: linear-gradient(135deg, rgba(13, 20, 35, 0.96), rgba(30, 27, 75, 0.96));
            border: 2px solid var(--accent-emerald); padding: 18px; border-radius: 24px;
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.35); backdrop-filter: blur(20px);
            width: 280px; text-align: center;
        }
        .arcade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; font-weight: 800; color: var(--accent-emerald); text-transform: uppercase; letter-spacing: 1px; }
        .arcade-screen { background: #04070d; border: 1px solid var(--border-glow); border-radius: 12px; padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent-cyan); margin-bottom: 12px; min-height: 65px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<!-- Widget Arcade (Substituto do Pet) -->
<div class="arcade-widget" id="arcadeWidget">
    <div class="arcade-header">
        <span>🎮 Reflexo Tático UEL</span>
        <button onclick="document.getElementById('arcadeWidget').style.display='none'" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-weight:bold;">✕</button>
    </div>
    <div class="arcade-screen" id="arcadeScreen">Clique em 'Iniciar' para treinar foco rápido!</div>
    <div style="display: flex; gap: 8px;">
        <button class="action-btn" onclick="iniciarMiniGame()" style="padding: 8px 12px; font-size: 11px; margin:0; flex:1; background:var(--accent-emerald); color:#04070d;">Iniciar</button>
        <button class="action-btn" onclick="pontuarMiniGame()" style="padding: 8px 12px; font-size: 11px; margin:0; flex:1;" id="btnAcaoGame" disabled>Foco!</button>
    </div>
</div>

<div class="container">
    <div class="top-utility-bar">
        <header class="hero">
            <div>
                <h1>PROJETO NEXO</h1>
                <p>Plataforma Longitudinal de Alta Performance para Medicina UEL</p>
            </div>
            <div class="hero-badge-tech"><div class="tech-pulse"></div>COPS-UEL 2027 // CORE ATIVO</div>
        </header>
        <div class="clock-widget">
            <div class="clock-time" id="liveClock">00:00:00</div>
            <div class="clock-date" id="liveDate">A carregar data...</div>
            <button class="calendar-sync-btn" onclick="agendarNoGoogleCalendar()">📅 Agendar no Google Calendar</button>
        </div>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="tools-bar">
        <button class="tool-btn" onclick="window.toggleTool('notesDrawer')">📝 Bloco de Notas</button>
        <button class="tool-btn" onclick="window.toggleTool('calcDrawer')">🧮 Calculadora Científica</button>
        <button class="tool-btn" onclick="window.toggleTool('radioDrawer')">📻 Streaming Gospel Internacional</button>
        <button class="tool-btn" onclick="window.toggleTool('quoteDrawer')">✝️ Cantinho da Clareza</button>
    </div>

    <!-- Notas (Com Funções Criar, Abrir, Renomear e Apagar) -->
    <div id="notesDrawer" class="aux-drawer">
        <strong style="color: var(--accent-cyan); display:block; margin-bottom: 12px; font-size: 16px;">📝 Gerenciador de Notas Acadêmicas</strong>
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <select id="notesSelect" onchange="carregarNotaSelecionada()" style="flex:1; padding:12px; background:rgba(15,23,42,0.85); color:#fff; border:1px solid var(--border-glow); border-radius:12px;">
                <option value="">-- Nova Nota --</option>
            </select>
            <button class="action-btn" onclick="novaNotaForm()" style="margin:0; padding:10px 16px; background:var(--accent-emerald); color:#04070d;">Novo</button>
        </div>
        <input type="hidden" id="noteId">
        <input type="text" id="noteTitle" placeholder="Título da nota / Matéria" style="margin-top:0;">
        <textarea id="noteContent" rows="5" placeholder="Escreva suas anotações estratégicas..." style="margin-top:12px;"></textarea>
        <div style="display: flex; gap: 10px; margin-top: 14px;">
            <button class="action-btn btn-success" onclick="salvarNotaAtual()" style="margin:0; flex:1;">💾 Salvar / Atualizar</button>
            <button class="action-btn" onclick="apagarNotaAtual()" style="margin:0; background:var(--accent-rose); color:#fff; flex:1;">🗑️ Apagar</button>
        </div>
    </div>

    <!-- Calculadora Científica Real com Efeitos e Sons -->
    <div id="calcDrawer" class="aux-drawer">
        <strong style="color: var(--accent-cyan); display:block; margin-bottom: 12px; font-size: 16px;">🧮 Calculadora Científica Avançada</strong>
        <div class="sci-calc-container">
            <input type="text" id="sciDisplay" class="sci-display" value="0" readonly>
            <div class="sci-grid">
                <button class="sci-btn" onclick="sciInput('sin(')">sin</button>
                <button class="sci-btn" onclick="sciInput('cos(')">cos</button>
                <button class="sci-btn" onclick="sciInput('tan(')">tan</button>
                <button class="sci-btn" onclick="sciInput('sqrt(')">√</button>
                <button class="sci-btn" onclick="sciClear()">AC</button>

                <button class="sci-btn" onclick="sciInput('7')">7</button>
                <button class="sci-btn" onclick="sciInput('8')">8</button>
                <button class="sci-btn" onclick="sciInput('9')">9</button>
                <button class="sci-btn op" onclick="sciInput('/')">÷</
